name: Veille HEP-VS — Mise à jour automatique

on:
  schedule:
    - cron: '0 7 * * 1'  # Tous les lundis à 7h UTC
  workflow_dispatch:

jobs:
  update-veille:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mise à jour automatique data.json
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const https = require('https');

          function httpsPost(url, body) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const opts = {
                hostname: u.hostname,
                path: u.pathname + u.search,
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { reject(new Error('JSON parse: ' + e.message)); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function httpsGet(url) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const opts = { hostname: u.hostname, path: u.pathname + u.search, method: 'GET' };
              https.get(opts, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { reject(new Error('JSON parse: ' + e.message)); }
                });
              }).on('error', reject);
            });
          }

          async function main() {
            const dataPath = 'data.json';
            const appData = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            if (!appData.sources_nationales) appData.sources_nationales = [];
            if (!appData.parlementaire) appData.parlementaire = [];
            let changed = false;

            // --- FNS ---
            try {
              const fnsData = await httpsPost(
                'https://data.snf.ch/api/grants/search',
                JSON.stringify({ q: 'HEP formation enseignants', limit: 10, from: 0 })
              );
              const grants = Array.isArray(fnsData) ? fnsData : (fnsData.grants || fnsData.data || fnsData.results || []);
              for (const g of grants) {
                const appNum = g.ApplicationNumber || g.application_number || g.Id || g.id;
                if (!appNum) continue;
                const id = 'fns-' + appNum;
                if (!appData.sources_nationales.find(x => x.id === id)) {
                  appData.sources_nationales.push({
                    id,
                    source: 'fns',
                    categorie: 'financement',
                    titre: g.Title || g.title || g.ProjectTitle || '',
                    date: g.StartDate || g.start_date || '',
                    description: 'Responsable : ' + (g.ResponsibleApplicant || g.responsible_applicant || '—') +
                                 ' · Institution : ' + (g.Institution || g.institution || '—'),
                    url: 'https://data.snf.ch/grants/' + appNum,
                    impacts: []
                  });
                  changed = true;
                  console.log('FNS ajouté :', id);
                }
              }
            } catch (e) {
              console.warn('FNS fetch error:', e.message);
            }

            // --- Parlement VS ---
            try {
              const parlData = await httpsGet(
                'https://parlement.vs.ch/api/fe/v1/full_text_search?search_term=HEP&object_type=ParlProcess&locale=fr&limit=10'
              );
              const hits = (parlData && parlData.results) || [];
              for (const r of hits) {
                const num = r.number || r.parl_process_number;
                if (!num) continue;
                const id = 'parl-' + num.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                if (!appData.parlementaire.find(x => x.id === id || x.parlProcessNumber === num)) {
                  appData.parlementaire.unshift({
                    id,
                    parlProcessId: r.id,
                    parlProcessNumber: num,
                    title: (r.label || r.title || '').replace(/<[^>]+>/g, ''),
                    docType: 'postulat',
                    status: 'encours',
                    priority: 'info',
                    section: 'indirect',
                    date: num,
                    authors: '',
                    vote: null,
                    description: '',
                    impacts: [],
                    financial: null,
                    officialUrl: 'https://parlement.vs.ch/fr/parl_process/' + r.id,
                    timeline: []
                  });
                  changed = true;
                  console.log('Parlement ajouté :', id);
                }
              }
            } catch (e) {
              console.warn('Parlement fetch error:', e.message);
            }

            // --- Vérifier alertes par mot-clé ---
            const alertKeywords = (appData.meta && appData.meta.alertKeywords) || [];
            const newEntries = [
              ...(appData.sources_nationales||[]).slice(-20),
              ...(appData.parlementaire||[]).slice(0,20)
            ];
            const triggeredAlerts = [];
            for (const kw of alertKeywords) {
              const kwLower = kw.toLowerCase();
              for (const entry of newEntries) {
                const text = [
                  entry.titre||entry.title||'',
                  entry.description||entry.content||'',
                  entry.responsable||'',
                  entry.institution||''
                ].join(' ').toLowerCase();
                if (text.includes(kwLower)) {
                  triggeredAlerts.push({ kw, entry: entry.titre||entry.title||entry.id });
                  break;
                }
              }
            }
            if (triggeredAlerts.length) {
              fs.writeFileSync('triggered_alerts.json', JSON.stringify(triggeredAlerts), 'utf8');
              console.log('Alertes déclenchées:', triggeredAlerts.map(a=>a.kw).join(', '));
            }

            // --- Mettre à jour lastUpdated ---
            if (!appData.meta) appData.meta = {};
            appData.meta.lastUpdated = new Date().toISOString().slice(0, 10);
            changed = true;

            fs.writeFileSync(dataPath, JSON.stringify(appData, null, 2), 'utf8');
            console.log('data.json mis à jour. Nouveaux éléments :', changed ? 'oui' : 'non');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit et push si changements
        id: commit
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: mise à jour automatique veille — $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            # Compter les nouveaux éléments
            COUNT=$(node -e "
              const d=JSON.parse(require('fs').readFileSync('data.json'));
              const today=new Date().toISOString().slice(0,10);
              const newFns=(d.sources_nationales||[]).filter(x=>x.source==='fns'&&x.date>=today.slice(0,7)).length;
              const newParl=(d.parlementaire||[]).filter(x=>x.id&&x.id.startsWith('parl-')).length;
              console.log(newFns+newParl);
            " 2>/dev/null || echo "0")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Créer une issue de notification si nouvelles entrées
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toLocaleDateString('fr-CH', {year:'numeric',month:'long',day:'numeric'});
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;

            // Lire les alertes déclenchées si elles existent
            let alertsSection = '';
            try {
              const alerts = JSON.parse(fs.readFileSync('triggered_alerts.json', 'utf8'));
              if (alerts.length) {
                alertsSection = [
                  '',
                  '### 🚨 Alertes mot-clé déclenchées',
                  ...alerts.map(a => `- Mot-clé **"${a.kw}"** → trouvé dans : _${a.entry}_`),
                  ''
                ].join('\n');
              }
            } catch(_) {}

            const labels = ['veille-auto', 'à-vérifier'];
            const isAlert = alertsSection.length > 0;
            if (isAlert) labels.push('alerte-mot-clé');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: isAlert
                ? `🚨 Veille juridique — Alerte mot-clé déclenchée (${date})`
                : `🔔 Veille juridique — Nouvelles entrées (${date})`,
              body: [
                '## Mise à jour automatique de la veille juridique HEP-VS',
                '',
                `Date : **${date}**`,
                alertsSection,
                '### Sources interrogées',
                '- 🔬 **FNS / SNSF** — `data.snf.ch`',
                '- 📜 **Parlement VS** — `parlement.vs.ch`',
                '',
                '### Action requise',
                `Consultez la compilation mise à jour : [${url}](${url})`,
                '',
                'Vérifiez les nouvelles entrées et ajustez leur priorité si nécessaire.',
                '',
                '---',
                '_Issue créée automatiquement par le workflow `veille-auto.yml`_',
                '_Fermez cette issue après vérification._'
              ].join('\n'),
              labels
            });

            // Préparer les infos pour l'email
            core.exportVariable('ALERT_DATE', date);
            core.exportVariable('ALERT_URL', url);
            core.exportVariable('ALERT_IS_KW', alertsSection.length > 0 ? 'true' : 'false');
            core.exportVariable('ALERT_BODY_MD', [
              isAlert ? '🚨 **Alerte mot-clé déclenchée**' : '🔔 **Nouvelles entrées détectées**',
              '',
              `Date : ${date}`,
              alertsSection,
              '**Sources interrogées :**',
              '- FNS / SNSF (data.snf.ch)',
              '- Parlement VS (parlement.vs.ch)',
              '',
              `Consultez la compilation : ${url}`,
              '',
              'Vérifiez les nouvelles entrées et ajustez leur priorité.',
            ].join('\n'));

      - name: Préparer l'adresse email destinataire
        if: steps.commit.outputs.changed == 'true'
        id: mail-prep
        run: |
          EMAIL=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('data.json','utf8'));
              console.log(d.meta && d.meta.alertEmail ? d.meta.alertEmail : '');
            } catch(e) { console.log(''); }
          ")
          echo "to=$EMAIL" >> $GITHUB_OUTPUT
          echo "has_email=$([ -n '$EMAIL' ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Envoyer l'email d'alerte
        if: steps.commit.outputs.changed == 'true' && steps.mail-prep.outputs.to != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.ALERT_IS_KW == 'true' && format('🚨 Alerte veille HEP-VS — Mot-clé détecté ({0})', env.ALERT_DATE) || format('🔔 Veille juridique HEP-VS — Mise à jour ({0})', env.ALERT_DATE) }}
          to: ${{ steps.mail-prep.outputs.to }}
          from: "Veille HEP-VS <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <!DOCTYPE html>
            <html lang="fr">
            <head><meta charset="UTF-8"><style>
              body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
              .card { background: #fff; border-radius: 8px; padding: 24px; max-width: 600px; margin: 0 auto; border-top: 4px solid #C8102E; }
              h2 { color: #1E2B3C; margin-top: 0; }
              .badge { background: #C8102E; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
              .alert-badge { background: #b45309; }
              .kw-item { background: #FEF3C7; border-left: 3px solid #b45309; padding: 6px 12px; margin: 6px 0; border-radius: 4px; font-size: 14px; }
              .btn { display: inline-block; background: #C8102E; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 16px; }
              .footer { font-size: 11px; color: #9ca3af; margin-top: 20px; text-align: center; }
            </style></head>
            <body><div class="card">
              <p><span class="badge ${{ env.ALERT_IS_KW == 'true' && 'alert-badge' || '' }}">${{ env.ALERT_IS_KW == 'true' && '🚨 ALERTE MOT-CLÉ' || '🔔 MISE À JOUR' }}</span></p>
              <h2>Veille juridique HEP-VS</h2>
              <p><strong>Date :</strong> ${{ env.ALERT_DATE }}</p>
              <p><strong>Sources interrogées :</strong> FNS / SNSF · Parlement VS</p>
              <p>De nouvelles entrées ont été détectées et ajoutées à la compilation.</p>
              <a href="${{ env.ALERT_URL }}" class="btn">📋 Consulter la compilation</a>
              <div class="footer">Email envoyé automatiquement par le workflow veille-auto.yml · GitHub Actions</div>
            </div></body></html>
          ignore_cert: false
